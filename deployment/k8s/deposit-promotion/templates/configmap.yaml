apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "deposit-promotion.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    type: backend
    {{- include "deposit-promotion.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "PromotionDeposits": {
        "PromotionServiceBaseUrl": "http://promotion-api",
        "PaymentServiceBaseUrl": "http://payment-api",
        "CalculateServiceBaseUrl": "http://tgs-calculate-api",
        "BrandCertificationBaseUrl": "http://brand-cert-api",
        "PlayerServiceBaseUrl": "http://player-api"
      },
      "Logging": {
        "LogLevel": {
          "Microsoft.AspNetCore.HttpLogging": "Information"          
        }
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
